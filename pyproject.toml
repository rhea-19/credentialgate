[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credentialgate"
version = "0.1.0"
description = "A synthetic credential service with an MCP authorization boundary"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "cryptography==50.0.2", "httpx==0.28.1", "mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]
agent = ["anthropic==0.125.0"]
web = ["Flask==3.1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["integrations/report-genie"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
